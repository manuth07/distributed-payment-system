version: '3.8'

services:
  zookeeper1:
    image: zookeeper:3.8
    container_name: zookeeper1
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  zookeeper2:
    image: zookeeper:3.8
    container_name: zookeeper2
    ports:
      - "2182:2181"
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  zookeeper3:
    image: zookeeper:3.8
    container_name: zookeeper3
    ports:
      - "2183:2181"
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  node1:
    build: .
    container_name: node1
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - ZOOKEEPER_URL=zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      - NODES=http://node1:8081,http://node2:8082,http://node3:8083,http://node4:8084,http://node5:8085
      - RAFT_PEERS=http://node1:8081,http://node2:8082,http://node3:8083,http://node4:8084,http://node5:8085
      - NODE_URL=http://node1:8081
    volumes:
      - ./data/node8081/:/app/data/node-8081/
    depends_on:
      zookeeper1:
        condition: service_healthy
      zookeeper2:
        condition: service_healthy
      zookeeper3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  node2:
