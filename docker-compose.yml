      - NODES=http://node1:8081,http://node2:8082,http://node3:8083,http://node4:8084,http://node5:8085
      - RAFT_PEERS=http://node1:8081,http://node2:8082,http://node3:8083,http://node4:8084,http://node5:8085
      - NODE_URL=http://node3:8083
