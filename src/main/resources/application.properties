spring.application.name=DS_project

# SERVER
server.port=${SERVER_PORT:8081}
node.id=node-${server.port}
node.url=http://localhost:${server.port}

# CLUSTER
nodes=http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:8085

# ZOOKEEPER
zookeeper.url=localhost:2181,localhost:2182,localhost:2183

# RAFT CONSENSUS
raft.node.id=${node.id}
raft.peers=http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:8085
raft.heartbeat.interval.ms=100
raft.election.timeout.min.ms=300
raft.election.timeout.max.ms=600
raft.quorum.size=3
raft.rpc.connect.timeout.ms=200
raft.rpc.read.timeout.ms=500

# RAFT PERSISTENCE
raft.data.dir=./data/${node.id}
raft.log.file=${raft.data.dir}/raft-log.jsonl
raft.state.file=${raft.data.dir}/raft-state.json

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

