spring.application.name=DS_project

# SERVER
server.port=${SERVER_PORT:8081}
node.id=node-${server.port}
node.url=http://localhost:${server.port}

# CLUSTER
nodes=http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:8085

# ZOOKEEPER
zookeeper.url=localhost:2181,localhost:2182,localhost:2183

# RAFT CONSENSUS
raft.node.id=${node.id}
raft.peers=http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:8085
raft.heartbeat.interval.ms=100
raft.election.timeout.min.ms=300
raft.election.timeout.max.ms=600
raft.quorum.size=3
raft.rpc.connect.timeout.ms=200
raft.rpc.read.timeout.ms=500

# RAFT PERSISTENCE
raft.data.dir=./data/${node.id}
raft.log.file=${raft.data.dir}/raft-log.jsonl
raft.state.file=${raft.data.dir}/raft-state.json

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# TIME SYNCHRONIZATION
timesync.enabled=true
timesync.interval=5000
timesync.remote-sync-timeout=200
timesync.skew-threshold=100
timesync.skew-monitoring-interval=10000
timesync.buffer-window=500
timesync.data-dir=./data

# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_URL:localhost:29092}
spring.kafka.consumer.group-id=ds-payment-group-${node.id}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.ds_project.kafka.PaymentEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

