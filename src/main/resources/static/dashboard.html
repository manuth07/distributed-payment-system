<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Payment Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #111827;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }

        .node-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .node-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; box-shadow: var(--shadow); transition: 0.2s; }
        .node-name { font-weight: 600; margin-bottom: 0.5rem; display: flex; justify-content: space-between; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot-online { background: var(--success); }
        .dot-offline { background: var(--danger); }
        
        .node-metrics { font-size: 0.8rem; color: var(--text-light); margin-bottom: 1rem; line-height: 1.6; }
        .metric-row { display: flex; justify-content: space-between; border-bottom: 1px solid #f9fafb; padding: 2px 0; }
        .metric-val { color: var(--text); font-weight: 500; }

        .btn-group { display: flex; gap: 0.5rem; }
        .btn { flex: 1; padding: 0.5rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .btn-stop { background: #fee2e2; color: #991b1b; }
        .btn-restart { background: #dcfce7; color: #166534; }
        .btn-reset { background: #6b7280; color: white; width: auto; padding: 0.5rem 1rem; }

        .workspace { display: grid; grid-template-columns: 1fr 1.5fr; gap: 2rem; }
        @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; } }
        
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
        .panel-heading { font-weight: 700; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }

        .form-row { margin-bottom: 1rem; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-light); margin-bottom: 0.25rem; }
        input { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; }
        .btn-submit { background: var(--primary); color: white; padding: 0.75rem; width: 100%; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; }

        .payment-list { list-style: none; font-size: 0.85rem; }
        .payment-item { display: flex; justify-content: space-between; padding: 0.75rem; border-bottom: 1px solid var(--border); }
        .payment-amt { font-weight: 700; color: var(--success); }

        .repl-table { width: 100%; font-size: 0.75rem; border-collapse: collapse; margin-top: 1rem; }
        .repl-table th { text-align: left; background: #f9fafb; padding: 0.5rem; color: var(--text-light); }
        .repl-table td { padding: 0.5rem; border-top: 1px solid var(--border); }

        #toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; border-radius: 8px; color: white; font-weight: 600; display: none; z-index: 100; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Distributed Payment Console</h1>
            <div id="master-state" style="font-size: 0.8rem; color: var(--text-light);">Loading...</div>
        </header>

        <div class="node-grid" id="nodes"></div>

        <div class="workspace">
            <div>
                <div class="panel">
                    <div class="panel-heading">Submit Payment</div>
                    <div class="form-row"><label>User ID</label><input type="text" id="uid" value="user_demo"></div>
                    <div class="form-row"><label>Amount (USD)</label><input type="number" id="amt" value="100.00"></div>
                    <button class="btn-submit" onclick="submit()">Confirm Payment</button>
                </div>

                <div class="panel">
                    <div class="panel-heading">Replication Monitoring</div>
                    <div id="repl-view">No leader data available.</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-heading">
                    Transaction Journal
                    <button class="btn btn-reset" onclick="resetData()">Clear Data</button>
                </div>
                <ul class="payment-list" id="ledger"></ul>
            </div>
        </div>
    </div>
    <div id="toast"></div>

    <script>
        const PORTS = [8081, 8082, 8083, 8084, 8085];
        let currentLeaderPort = 8081;

        async function tick() {
            const results = await Promise.all(PORTS.map(async (p, i) => {
                try {
                    const status = await fetch(`http://localhost:${p}/payments/cluster-status`).then(r => r.json());
                    const time = await fetch(`http://localhost:${p}/timesync/status`).then(r => r.json());
                    return { i, port: p, online: true, raft: status, time: time };
                } catch (e) { return { i, port: p, online: false }; }
            }));

            renderNodes(results);
            const leader = results.find(r => r.online && r.raft.raftState === 'LEADER');
            if (leader) {
                currentLeaderPort = leader.port;
                renderLedger(leader.port);
                renderRepl(leader.raft);
                document.getElementById('master-state').textContent = `Cluster Healthy • Leader: Node ${leader.i + 1}`;
            } else {
                document.getElementById('master-state').textContent = '⚠️ Election in Progress...';
            }
        }

        function renderNodes(data) {
            document.getElementById('nodes').innerHTML = data.map(d => `
                <div class="node-card" style="${!d.online ? 'opacity:0.6' : ''}">
                    <div class="node-name">Node ${d.i + 1} <span class="status-dot ${d.online ? 'dot-online' : 'dot-offline'}"></span></div>
                    <div class="node-metrics">
                        <div class="metric-row"><span>Raft State:</span><span class="metric-val">${d.online ? d.raft.raftState : 'OFFLINE'}</span></div>
                        <div class="metric-row"><span>Node Time:</span><span class="metric-val">${d.online ? new Date(Date.now() + d.time.clockOffset).toLocaleTimeString() : '--:--:--'}</span></div>
                        <div class="metric-row"><span>Offset:</span><span class="metric-val">${d.online ? d.time.clockOffset + 'ms' : '-'}</span></div>
                        <div class="metric-row"><span>Skew:</span><span class="metric-val">${d.online ? d.time.estimatedSkew + 'ms' : '-'}</span></div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-restart" onclick="act(${d.port})">Restart</button>
                        <button class="btn btn-stop" onclick="act(${d.port})">Stop</button>
                    </div>
                </div>
            `).join('');
        }

        async function renderLedger(port) {
            try {
                const payments = await fetch(`http://localhost:${port}/payments`).then(r => r.json());
                document.getElementById('ledger').innerHTML = payments.length ? payments.slice(-8).reverse().map(p => `
                    <li class="payment-item">
                        <div><div style="font-weight:600">${p.userId}</div><div style="font-size:0.7rem;color:var(--text-light)">${p.id.split('-')[0]}</div></div>
                        <div class="payment-amt">$${parseFloat(p.amount).toFixed(2)}</div>
                    </li>`).join('') : '<li style="text-align:center;color:var(--text-light);padding:1rem;">Journal is empty</li>';
            } catch(e) {}
        }

        function renderRepl(raft) {
            if (!raft.peerReplication) return;
            let html = '<table class="repl-table"><thead><tr><th>Peer</th><th>Next</th><th>Match</th></tr></thead><tbody>';
            Object.entries(raft.peerReplication).forEach(([peer, data]) => {
                html += `<tr><td>${peer}</td><td>${data.nextIndex}</td><td>${data.matchIndex}</td></tr>`;
            });
            document.getElementById('repl-view').innerHTML = html + '</tbody></table>';
        }

        async function submit() {
            const uid = document.getElementById('uid').value, amt = document.getElementById('amt').value;
            try {
                const res = await fetch(`http://localhost:${currentLeaderPort}/payments?userId=${uid}&amount=${amt}`, { method: 'POST' });
                if (res.ok) toast("✅ Committed", "#059669"); else toast("❌ Consensus failed", "#dc2626");
            } catch(e) { toast("❌ Connection error", "#dc2626"); }
        }

        async function resetData() {
            if (!confirm("Clear all payments on ALL nodes?")) return;
            toast("🧹 Clearing system...", "#6b7280");
            await Promise.all(PORTS.map(p => fetch(`http://localhost:${p}/admin/reset-all`, { method: 'POST' }).catch(e => {})));
            tick();
        }

        async function act(port) {
            toast("🔄 Instruction sent...", "#2563eb");
            try { await fetch(`http://localhost:${port}/admin/shutdown`, { method: 'POST' }); } catch(e) {}
        }

        function toast(m, c) {
            const t = document.getElementById('toast'); t.textContent = m; t.style.background = c; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        setInterval(tick, 3000); tick();
    </script>
</body>
</html>
